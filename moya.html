<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Moya, the Arcade's mind reader: think of a real or made-up character and Moya guesses who it is.">
<meta name="theme-color" content="#120a33">
<title>Moya, the Mind Reader | Arcade</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='30' r='26' fill='%238a63f2'/%3E%3Cellipse cx='23' cy='29' rx='6' ry='7' fill='%23fff'/%3E%3Cellipse cx='41' cy='29' rx='6' ry='7' fill='%23fff'/%3E%3Ccircle cx='23' cy='30' r='3.4' fill='%23160934'/%3E%3Ccircle cx='41' cy='30' r='3.4' fill='%23160934'/%3E%3Cpath d='M32 9l4 5-4 5-4-5z' fill='%23ffcf5a'/%3E%3Cpath d='M25 41q7 6 14 0' stroke='%23160934' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="src/common/arcade.css">
<link rel="stylesheet" href="src/moya/moya.css?v=moya-1">
</head>
<body data-screen="title">
<canvas id="sky" aria-hidden="true"></canvas>
<div id="app">
  <header class="top">
    <a class="back" href="index.html?from=moya" aria-label="Back to the Arcade"><span aria-hidden="true">‹</span> Arcade</a>
    <div class="brand" aria-hidden="true">MOYA <small>THE MIND READER</small></div>
    <div class="tools">
      <button type="button" class="icon" id="soundBtn" data-act="sound" aria-label="Sound on" title="Sound on/off"></button>
      <button type="button" class="icon" id="helpBtn" data-act="help" aria-label="How to play" title="How to play">?</button>
      <button type="button" class="icon" id="menuBtn" data-act="pause" aria-label="Menu" title="Menu">☰</button>
    </div>
  </header>
  <main class="stage">
    <section class="seer" aria-label="Moya">
      <div class="ring" aria-hidden="true"></div>
      <div id="moya"></div>
      <div class="meter" id="meter" aria-hidden="true"><i></i><span>Reading your mind…</span></div>
    </section>
    <section class="panel" id="panel" aria-live="polite"></section>
  </main>
  <footer id="hints" aria-hidden="true"></footer>
</div>
<div id="overlay" class="hidden" role="dialog" aria-modal="true"></div>
<canvas id="confetti" aria-hidden="true"></canvas>
<noscript><p class="noscript">Moya needs JavaScript. Open the Arcade through its web server (Play Arcade.cmd or python serve.py).</p></noscript>
<script type="module" src="src/moya/main.js?v=moya-1"></script>
</body>
</html>
