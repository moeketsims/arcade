<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dash Derby</title>
<link rel="stylesheet" href="src/common/arcade.css">
<link rel="stylesheet" href="src/kart/kart.css">
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.js", "three/addons/": "./vendor/three/addons/" } }
</script>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud" class="hidden">
  <div id="itemSlot"><div class="ibox"><div id="itemIcon"></div><span id="itemUses"></span></div><div id="itemName"></div></div>
  <div id="placeBox"><span id="place">8</span><sup id="placeSuf">th</sup></div>
  <div id="lapBox"><div id="lapText">LAP 1/3</div><div id="timeText">0:00.000</div><div id="lapTimes"></div></div>
  <div id="ranks"></div>
  <canvas id="minimap" width="200" height="200"></canvas>
  <div id="speedo"><div id="speed">0</div><small>km/h</small><div id="driftBar"><i></i></div></div>
  <div id="center"></div>
  <div id="msg"></div>
  <div id="hint"></div>
  <div id="replayTag" class="hidden"><b>● REPLAY</b><span id="replayInfo"></span></div>
</div>

<div id="screen" class="hidden"></div>
<div id="fade" class="fade"></div>
<script type="module" src="src/kart/main.js"></script>
</body>
</html>
